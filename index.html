<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bloodborne — Lore Item Map</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap');

  :root {
    --bg:        #0d0b0a;
    --surface:   #161210;
    --border:    #3a2e22;
    --gold:      #c8a46e;
    --gold-dim:  #7a6040;
    --red:       #8b2a2a;
    --mist:      #4a6070;
    --text:      #d4c4a8;
    --text-dim:  #7a6a54;
    --rune:      #7a5c8c;
    --chalice:   #4a7c5c;
    --key:       #8c6a30;
    --dlc-accent:#c87c5a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Crimson Text', serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── header ── */
  header {
    padding: 12px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: linear-gradient(180deg, #1a1410 0%, var(--bg) 100%);
    flex-shrink: 0;
  }
  header h1 {
    font-family: 'Cinzel', serif;
    font-size: 1.1rem;
    font-weight: 600;
    color: var(--gold);
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }
  header p {
    font-size: 0.85rem;
    color: var(--text-dim);
    font-style: italic;
  }

  /* ── layout ── */
  .main {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* ── filters sidebar ── */
  .sidebar {
    width: 220px;
    border-right: 1px solid var(--border);
    padding: 16px;
    overflow-y: auto;
    flex-shrink: 0;
    background: var(--surface);
  }
  .sidebar h2 {
    font-family: 'Cinzel', serif;
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--gold-dim);
    margin-bottom: 12px;
  }
  .filter-group { margin-bottom: 20px; }
  .filter-group label {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.88rem;
    color: var(--text);
    cursor: pointer;
    padding: 3px 0;
    transition: color 0.2s;
  }
  .filter-group label:hover { color: var(--gold); }
  .filter-group input[type=checkbox] {
    appearance: none;
    width: 14px; height: 14px;
    border: 1px solid var(--border);
    border-radius: 2px;
    cursor: pointer;
    position: relative;
    flex-shrink: 0;
  }
  .filter-group input[type=checkbox]:checked {
    background: var(--gold);
    border-color: var(--gold);
  }
  .filter-group input[type=checkbox]:checked::after {
    content: '✓';
    position: absolute;
    top: -2px; left: 1px;
    font-size: 11px;
    color: var(--bg);
    font-weight: bold;
  }

  .dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .dot-key     { background: var(--key); }
  .dot-rune    { background: var(--rune); }
  .dot-chalice { background: var(--chalice); }

  .stats {
    font-size: 0.78rem;
    color: var(--text-dim);
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    line-height: 1.8;
  }
  .stats span { color: var(--gold); font-weight: 600; }

  /* ── map area ── */
  .map-wrap {
    flex: 1;
    position: relative;
    overflow: hidden;
  }

  #map-svg {
    width: 100%;
    height: 100%;
    cursor: grab;
  }
  #map-svg:active { cursor: grabbing; }

  .edge {
    stroke: var(--border);
    stroke-width: 1;
    stroke-dasharray: 4 4;
    opacity: 0.5;
  }

  .area-node {
    cursor: pointer;
  }
  .area-node circle {
    transition: r 0.2s, opacity 0.2s;
  }
  .area-node:hover circle { opacity: 1 !important; }
  .area-node text {
    font-family: 'Cinzel', serif;
    font-size: 9px;
    fill: var(--text);
    text-anchor: middle;
    pointer-events: none;
    dominant-baseline: middle;
    letter-spacing: 0.05em;
  }

  /* Region label */
  .region-label {
    font-family: 'Cinzel', serif;
    font-size: 8px;
    fill: var(--text-dim);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    pointer-events: none;
  }

  /* ── item panel ── */
  .item-panel {
    width: 300px;
    border-left: 1px solid var(--border);
    background: var(--surface);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    flex-shrink: 0;
    transition: width 0.3s;
  }
  .item-panel.hidden { width: 0; border: none; }

  .panel-header {
    padding: 14px 16px 10px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 8px;
  }
  .panel-header h3 {
    font-family: 'Cinzel', serif;
    font-size: 0.9rem;
    color: var(--gold);
    line-height: 1.3;
  }
  .panel-header .area-badge {
    font-size: 0.7rem;
    color: var(--text-dim);
    font-style: italic;
    margin-top: 2px;
  }
  .close-btn {
    background: none;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 1.2rem;
    padding: 0;
    flex-shrink: 0;
    line-height: 1;
  }
  .close-btn:hover { color: var(--gold); }

  .item-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px 0;
  }
  .item-list::-webkit-scrollbar { width: 4px; }
  .item-list::-webkit-scrollbar-track { background: var(--surface); }
  .item-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .item-entry {
    padding: 10px 16px;
    border-bottom: 1px solid rgba(58,46,34,0.5);
    cursor: pointer;
    transition: background 0.15s;
  }
  .item-entry:hover { background: rgba(200,164,110,0.06); }
  .item-entry.expanded { background: rgba(200,164,110,0.06); }

  .item-name {
    font-family: 'Cinzel', serif;
    font-size: 0.78rem;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 7px;
  }
  .item-cat-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .item-desc {
    margin-top: 7px;
    font-size: 0.82rem;
    font-style: italic;
    color: var(--text-dim);
    line-height: 1.55;
    display: none;
  }
  .item-desc.show { display: block; }

  .item-meta {
    margin-top: 6px;
    font-size: 0.72rem;
    color: var(--gold-dim);
    display: none;
  }
  .item-meta.show { display: flex; gap: 12px; flex-wrap: wrap; }

  .meta-tag {
    background: rgba(200,164,110,0.1);
    border: 1px solid rgba(200,164,110,0.2);
    padding: 1px 6px;
    border-radius: 2px;
  }

  /* ── no-area panel ── */
  .empty-state {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 12px;
    color: var(--text-dim);
    padding: 24px;
    text-align: center;
  }
  .empty-state .glyph {
    font-size: 2rem;
    opacity: 0.3;
  }
  .empty-state p {
    font-size: 0.85rem;
    font-style: italic;
    line-height: 1.6;
  }

  /* ── region background boxes ── */
  .region-bg { opacity: 0.04; }
</style>
</head>
<body>

<header>
  <div>
    <h1>Bloodborne — Lore Item Map</h1>
  </div>
  <p id="item-count-display"></p>
</header>

<div class="main">

  <aside class="sidebar">
    <div class="filter-group">
      <h2>Category</h2>
      <label><input type="checkbox" class="cat-filter" value="Key Item" checked>
        <span class="dot dot-key"></span> Key Items</label>
      <label><input type="checkbox" class="cat-filter" value="Caryll Rune" checked>
        <span class="dot dot-rune"></span> Caryll Runes</label>
      <label><input type="checkbox" class="cat-filter" value="Chalice Ritual Material" checked>
        <span class="dot dot-chalice"></span> Ritual Materials</label>
    </div>

    <div class="filter-group">
      <h2>Acquisition</h2>
      <label><input type="checkbox" class="acq-filter" value="found" checked> Found</label>
      <label><input type="checkbox" class="acq-filter" value="npc/quest" checked> NPC / Quest</label>
      <label><input type="checkbox" class="acq-filter" value="shop" checked> Shop</label>
      <label><input type="checkbox" class="acq-filter" value="boss drop" checked> Boss Drop</label>
      <label><input type="checkbox" class="acq-filter" value="enemy drop" checked> Enemy Drop</label>
    </div>

    <div class="filter-group">
      <h2>Content</h2>
      <label><input type="checkbox" id="dlc-filter" checked> Include DLC</label>
      <label><input type="checkbox" id="base-filter" checked> Include Base Game</label>
    </div>

    <div class="stats" id="sidebar-stats"></div>
  </aside>

  <div class="map-wrap">
    <svg id="map-svg" viewBox="0 0 1000 880" preserveAspectRatio="xMidYMid meet">
      <defs>
        <filter id="glow">
          <feGaussianBlur stdDeviation="3" result="blur"/>
          <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="glow-strong">
          <feGaussianBlur stdDeviation="5" result="blur"/>
          <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>

      <!-- Region background labels -->
      <text class="region-label" x="340" y="60" text-anchor="middle">The Old Hunters (DLC)</text>
      <text class="region-label" x="480" y="600" text-anchor="middle">Chalice Dungeons</text>
      <text class="region-label" x="350" y="555" text-anchor="middle">Pthumeru ·· Loran ·· Isz</text>

      <!-- Chalice dungeon divider line -->
      <line x1="50" y1="620" x2="950" y2="620" stroke="#3a2e22" stroke-width="1" stroke-dasharray="8 4" opacity="0.4"/>

      <!-- DLC divider line -->
      <line x1="680" y1="40" x2="950" y2="40" stroke="#c87c5a" stroke-width="1" stroke-dasharray="6 4" opacity="0.3"/>

      <!-- Edges -->
      <g id="edges-layer"></g>

      <!-- Nodes -->
      <g id="nodes-layer"></g>
    </svg>
  </div>

  <aside class="item-panel hidden" id="item-panel">
    <div class="panel-header">
      <div>
        <h3 id="panel-area-name">—</h3>
        <div class="area-badge" id="panel-item-count"></div>
      </div>
      <button class="close-btn" onclick="closePanel()">×</button>
    </div>
    <div class="item-list" id="item-list"></div>
  </aside>

</div>

een will drop the Crow Hunter Badge when killed. | It's possible for Eileen to be killed by | Henryk | and drop the Crow Hunter Badge as a result. |", "area_tags": "Pthumeru; Ailing Loran; Lower Loran; Ihyll", "acquisition": "npc/quest", "dlc": "False"}, {"item_name": "Eileen the Crow", "category": "Key Item", "sub_type": "Tool", "description": "(Laughter) \"Few hunters can resist the intoxication of the hunt. Look at you, just the same as all the rest...\" \"The hunters must die... The nightmare must end...\" \"Only I can stop this madness!\" (continued laughter) When Eileen has been significantly injured, \"The beasts cannot be stopped. What good are hunters now?\" (Yelling) \"Your blood is mine! A hunter's blood for me! Your punishment is death! Death to hunters!\" \"Enough of this terrible dream!\" (laughter) When Eileen is slain, \"...Ahh... you monsters...\" \"All hunters must die!\" (laughter as her body fades)", "location_raw": "Drops | Central Yharnam | (Sewer Entrance) | 5198 (2318) Blood Echoes | Crow Hunter Badge | Eileen the Crow | is a | non-player character (NPC) | in | Bloodborne | . Wearing a Beak Mask, | Eileen the Crow | is the one who hunts hunters who have become corrupted from hunting beasts. | A hunter should", "area_tags": "Central Yharnam; Cathedral Ward; Forbidden Woods", "acquisition": "npc/quest", "dlc": "False"}, {"item_name": "Piercing Rifle", "category": "Key Item", "sub_type": "Tool", "description": "Designed for hunting on narrow streets, this weapon has been optimized to cause perforation wounds, but is unfit for reliably counter attacks.", "location_raw": "Purchasable at the messenger bath after acquiring the | Firing Hammer Badge | . | Player Notes | Good against groups, as its piercing shots can deal full damage to all enemies in a straight line. | The shot and recovery speed is similar to a | Blunderbuss | , with the recovery being a bit slower, wh", "area_tags": "", "acquisition": "found", "dlc": "False"}, {"item_name": "Old Hunter Badge", "category": "Key Item", "sub_type": "Badge", "description": "This hunter's badge, crafted in Gehrman's time, has no practical purpose, except perhaps to assist in romanticizing the past. The badge was a special privilege for the hunters of the past, and should not be dishonored. It should be left in peace, unless one is truly prepared to assume the will of those gone before.\"", "location_raw": "Hunter's Dream | Old Hunter Badge | is a | Key Item | in | Bloodborne | . The | Old Hunter Badge | unlocks several purchasable items in the | Messenger | shop, such as the | Burial Blade | . To obtain the | Old Hunter Badge | , | Gehrman, The First Hunter | must be defeated. | This hunter's badge, c", "area_tags": "Hunter's Dream", "acquisition": "shop", "dlc": "False"}, {"item_name": "Burial Blade", "category": "Key Item", "sub_type": "Tool", "description": "Gehrman surely saw the hunt as a dirge of farewell, wishing only that his prey might rest in peace, never again to awaken to another harrowing nightmare. \"", "location_raw": "Normal | It can be purchased from the | Messengers | for 60,000 Blood Echoes after defeating | Gehrman, the First Hunter | and acquiring the | Old Hunter Badge | from him. | To make Gehrman fight you, the \"Refuse\" option must be selected. | If one accepts his proposal, the game will outright end the", "area_tags": "Chalice Dungeon; Pthumeru; Ailing Loran; Ihyll", "acquisition": "shop", "dlc": "False"}, {"item_name": "Gehrman, the First Hunter", "category": "Key Item", "sub_type": "Tool", "description": "\"Hm hm hm ha ha ha... Dear oh dear, what was it? The Hunt? The Blood? Or the horrible Dream? Oh, it doesn't matter... It always comes down to the hunters' helper to clean up after these sort of messes.\"", "location_raw": "Drops | 14293 | 128000 | Hunter's Dream | Old Hunter Badge | Defenses | -- | 150 | 150 | 150 | -- | 150 | 65 | 70 | 65 | 999 | 999 | No | No | Gehrman, the First Hunter | is a | Boss | in | Bloodborne | . | Gehrma ayer. They appear to have fallen victim to the plague as well and so attack anything that comes near. They are highly aggressive and are attracted by the smell of blood. They will attack humans if they get close, so that those that live will become carrion for them to eat. These enemies always lie on the ground, flawlessly blending into whatever environment they are in. As such, they are often only noticed once the player is near a tight cluster. This means that players will be ambushed and likely…", "location_raw": "Central Yharnam | , | Cathedral Ward | , | Old Yharnam | , | Healing Church Workshop | , | Hemwick Charnel Lane | , | Forbidden Woods | , | Iosefka's Clinic | , | Upper Cathedral Ward | , | Nightmare of Mensis | Carrion Crows | in | Bloodborne | are bird-like creatures that appear in flocks and usua", "area_tags": "Central Yharnam; Cathedral Ward; Old Yharnam; Forbidden Woods; Hemwick Charnel Lane; Nightmare of Mensis; Upper Cathedral Ward", "acquisition": "shop", "dlc": "False"}, {"item_name": "Heir", "category": "Caryll Rune", "sub_type": "Rune", "description": "A secret symbol left by Caryll, runesmith of Byrgenwerth. The \"Heir\" sees sentimentality in the warmth of blood, acknowledging this as one of the darker hunter techniques.More Blood Echoes gained from visceral attacks.Perhaps the \"Heir\" is a hunter who bears the echoing will of those before him.", "location_raw": "Tier 1 - 30% bonus - Encounter with | Henryk | and | Eileen the Crow | in | Tomb of Oedon | . Defeat | Henryk | together with | Eileen the Crow | and receive the rune. If | Eileen the Crow | dies during the encounter you need to defeat the hunter to receive the rune. | Tier 2 - A stronger version(~4", "area_tags": "Byrgenwerth; Yahar'gul; Unseen Village; Pthumeru; Ihyll", "acquisition": "boss drop", "dlc": "False"}, {"item_name": "Henryk", "category": "Caryll Rune", "sub_type": "Rune", "description": "\"The taciturn old hunter Henryk was once partners with Father Gascoigne, and though they were a fierce and gallant duo, their partnership led to Henryk's tragically long life.\"", "location_raw": "Old Hunter Henryk | is found at the | Tomb of Oedon | and is automatically hostile. To encounter him, follow | Eileen the Crow’s | quest and speak to her at the | Cathedral Ward | . | Can | Old Hunter Henryk | be an ally? | Yes, he can be summoned in the | Forbidden Woods | and | Byrgenwerth | , but", "area_tags": "Cathedral Ward; Forbidden Woods; Byrgenwerth; Hunter's Dream", "acquisition": "npc/quest", "dlc": "False"}, {"item_name": "Tomb of Oedon", "category": "Caryll Rune", "sub_type": "Rune", "description": "The Byrgenwerth spider hides all manner of rituals, and keeps our lost master from us. A terrible shame. It makes my head shudder uncontrollably", "location_raw": "? | Central Yharnam | Bosses | Father Gascoigne | Co op Allowed? | Yes | PvP Allowed? | Yes | Changes in NG+? | Yes/No | Tomb of Oedon | is a Lamp in Bloodborne. It is within the | Central Yharnam | location. | \"Description goes here\" | . | Tomb of Oedon Information | NPCs in the area | Eileen the C", "area_tags": "Central Yharnam; Byrgenwerth", "acquisition": "npc/quest", "dlc": "False"}, {"item_name": "Hunter", "category": "Caryll Rune", "sub_type": "Oath", "description": "A Caryll Rune that transcribes inhuman sounds.This red-smudged rune means \"Hunter\", and has been adopted by those who have taken the Hunter of Hunters oath. These watchmen admonish those who have become addled with blood.Be they men or beasts, anyone who has threatened the pledgers of the \"Hunter\" oath surely has an issue with blood.", "location_raw": "Earned by completing the | Eileen the Crow | questline.", "area_tags": "", "acquisition": "npc/quest", "dlc": "False"}, {"item_name": "Crow Hunter Badge", "category": "Caryll Rune", "sub_type": "Rune", "description": "Badge of a hunter of hunters. who hunts those who have become addled with blood. The badge of the hunter of hunters is quietly passed down u reach an iron door. If you didn't open it you need to go open it first. Looking at the iron door you need to go right and follow the path until you come back to the iron door from the other side. Then go straight again ", "area_tags": "Byrgenwerth; Hemwick Charnel Lane; Pthumeru; Ihyll", "acquisition": "enemy drop", "dlc": "False"}, {"item_name": "Hemwick Charnel Lane", "category": "Caryll Rune", "sub_type": "Rune", "description": "Hemwick Charnel Lane is a location in Bloodborne. Accessed from Cathedral Ward (Grand Cathedral Lamp), follow the right path exiting the cathedral and go through a tunnel that lands you at a graveyard with many Rifle Huntsmen and Hunting Dogs. You may travel to Cainhurst Castle from here.", "location_raw": "Advent Plaza | Ailing Loran | Amygdala's Chamber | Byrgenwerth | Cainhurst Castle | Cathedral District | Cathedral Ward | Chalice Dungeon | Chalice Dungeon Locations | Cursed Pthumerian Defilement | Fishing Hamlet | Forbidden Woods | Graveyard of the Darkbeast | Healing Church Workshop | Hemwick Cha", "area_tags": "Cathedral Ward; Old Yharnam; Forbidden Woods; Byrgenwerth; Hemwick Charnel Lane; Nightmare Frontier; Nightmare of Mensis; Cainhurst Castle; Upper Cathedral Ward; Hunter's Dream; Hunter's Nightmare; Research Hall; Fishing Hamlet; Chalice Dungeon; Ailing Loran; Lecture Building", "acquisition": "shop", "dlc": "True"}, {"item_name": "Milkweed", "category": "Caryll Rune", "sub_type": "Oath", "description": "A Caryll rune envisioned by Adeline, patient of the Research Hall. A translation of the inhuman, sticky whispers that reveal the nature of a celestial attendant.Those who swear this oath become a Lumenwood that peers towards the sky, feeding phantasmsin its luscious bed. Phantasms guide us and lead us to further discoveries.", "location_raw": "Received from | Saint Adeline | in the | Research Hall | after finishing her questline. | Milkweed Notes | To memorize this rune, you must have the | Rune Workshop Tool | . | Kos Parasite | receives an enhanced moveset, but the rune is required to use it effectively. | Players receive reduced fall d", "area_tags": "Research Hall; Fishing Hamlet", "acquisition": "npc/quest", "dlc": "True"}, {"item_name": "Snatchers", "category": "Caryll Rune", "sub_type": "Rune", "description": "Snatchers are an enemy in Bloodborne. Snatchers are tall, hooded monsters that appear in and around Cathedral Ward after the Hunter defeats the Blood-Starved Beast. They sling a large bag over their shoulder that they use to attack. If killed by a Snatcher, the Hunter will be brought to a prison called Hypogean Gaol. This is the only way to enter the Unseen Village before the red moon. Much of Yahar'gul will remain inaccessible until Rom is killed. However, after Rom is dead and the red moon hangs low, all Snatchers will mysteriously disappear from Yharnam.", "location_raw": "Cathedral Ward | 910 | 1368 | (x1) Drop% | (x2) Drop% | (x1) Drop% | Forbidden Woods | 910 | 1706 | (x1) Drop% | (x2) Drop% | (x1) Drop% | Hypogean Gaol | 910 | 1368 | (x1) Drop% | (x2) Drop% | (x1) Drop%", "area_tags": "Cathedral Ward; Forbidden Woods; Yahar'gul; Unseen Village", "acquisition": "enemy drop", "dlc": "False"}, {"item_name": "Micolash", "category": "Caryll Rune", "sub_type": "Rune", "description": "Ahhh Kos... or some say Kosm. Do you hear our prayers?\"", "location_raw": "Drops | 5250 | 48400 | Nightmare of Mensis | Mensis Cage | Defenses | -- | 169 | 134 | 125 | -- | 179 | 232 | 124 | 125 | 144 | 132 | No | No | Micolash, Host of the Nightmare | (悪夢の主ミコラーシュ | Akumu no shu Mikorāshu | lit. | \"Micolash, Lord of the Nightmare\" | ) is a | Boss | in | Bloodborne | . | Mi", "area_tags": "Nightmare of Mensis", "acquisition": "shop", "dlc": "False"}, {"item_name": "Brain of Mensis", "category": "Caryll Rune", "sub_type": "Rune", "description": "Brain of Mensis is an enemy in Bloodborne. The Brain of Mensis, also known as \"Mother Brain\", is an enemy resembling a giant brain with various eyes and some beastly limbs. It is essentially a large version of Winter Lanterns, though without a body. It is first encountered from a distant tower at the beginning of Nightmare of Mensis, and will glow orange when the player is in line of sight, causing rapid Frenzy buildup. This attack can hurt the player even from a very long distance, unless the environment is used to avoid its malignant gaze. The Brain of Mensis can be slain after defeating Mic…", "location_raw": "Nightmare of Mensis | Brain of Mensis | is an | enemy | in | Bloodborne | . | The | Brain of Mensis | , | also known as \"Mother Brain\", is an enemy resembling a giant brain with various eyes and some beastly limbs. It is essentially a large version of | Winter Lanterns | , though without a body | . ", "area_tags": "Nightmare of Mensis", "acquisition": "boss drop", "dlc": "False"}, {"item_name": "gesture (wait for your hunter to switch sides)", "category": "Caryll Rune", "sub_type": "Rune", "description": "Gestures are player-generated emotes available in Bloodborne. To access the gesture menu, hit the left side of the touchpad on your controller and then perform the action or highlight your chosen gesture and press the action button to execute. You can also use gestures by holding the X button and moving the controller in the specified direction. You can move, although slowly, while performing some gestures (e.g. Point Forward, Wave, Shake off Cape), others have a set animation you cannot interrupt (e.g. Curtsy, Hunter's Salutation) and some have a continued animation until you decide to interr…", "location_raw": "Point Forward | Available from start of game. | Hunter's Salutation | Available from start of game. | Sit Down | Available from start of game. | Hunter's Rally | Available from start of game. | Joy | Available from start of game. | Conviction | Available from start of game. | Wave | Available from s", "area_tags": "Central Yharnam; Cathedral Ward; Upper Cathedral Ward; Lecture Building", "acquisition": "npc/quest", "dlc": "False"}, {"item_name": "Oedon Writhe", "category": "Caryll Rune", "sub_type": "Rune", "description": "A Caryll rune that transcribes inhuman sounds.\"Writhe\" sees a subtle mucous in the warmth of blood, and acknowledges visceral attacks as one of the darker hunter techniques. Visceral attacks restore Quicksilver Bullets.Human or not, the oozing blood is a medium of the highest grade, and the essence of the formless Great One.Both Oedon, and Oedon's inadvertent worshippers, surreptitiously seek the precious blood.", "location_raw": "(+1) is obtained by killing | Adella the Nun | at | Hypogean Gaol | or sending her to Oedon's Chapel and killing her there. A second method is to send her to | Iosefka's Clinic | and collecting the heir rune from a kin. | (+2) is obtained by killing | Iosefka | 's Imposter at | Iosefka's Clinic | , ", "area_tags": "Pthumeru; Ihyll", "acquisition": "enemy drop", "dlc": "False"}, {"item_name": "Radiance", "category": "Caryll Rune", "sub_type": "Rune", "description": "A secret symbol left by Caryll, runesmith of Byrgenwerth.The rune for \"Radiance,\" adopted by the sworn Executioners under Logarius' command. The executioners despise the impure Vilebloods, and no matter what the circumstances,would never cooperate with the bloodthirsty hunters who serve the undead queen, Annalise.", "location_raw": "If you revisit the statue in | Cathedral Ward | , outside the entrance to Old Yharnam where you first meet | Alfred | (after he has killed Annalise), you'll find his inexplicably dead body with the rune. | This rune can also be attained by killing Alfred after he has killed Annalise", "area_tags": "Cathedral Ward; Old Yharnam; Byrgenwerth", "acquisition": "found", "dlc": "False"}, {"item_name": "Alfred's", "category": "Caryll Rune", "sub_type": "Rune", "description": "\"Byrgenwerth is an old place of learning. And the tomb of the gods, carved out below Yharnam, should be familiar to every hunter.\" \"Well, onc rdly a threat one-on-one, these vermin travel in packs in the | labyrinth | . A pack of plague-ridden rats can take turns pouncing the Hunter with toxic fangs. | Rats are fairly common in Yharnam se", "area_tags": "Central Yharnam; Chalice Dungeon", "acquisition": "found", "dlc": "False"}, {"item_name": "Yellow Backbone", "category": "Chalice Ritual Material", "sub_type": "Material", "description": "Special material used in a Holy Chalice rite. Special body parts collected by the Healing Church. What was this gruesome bait used to lure? The additional rite Rotted Offering beckons ungodly forces, normally terrifying things, but also worthy prey for a special hunt.\"", "location_raw": "Insight Bath Messenger | shop (NG+) | Chalice Dungeons | Yellow Backbone | is a | Material | in | Bloodborne | . The | Yellow Backbone | is used as a ritual material in creating | Chalice Dungeons | . This material can be obtained from | Chalice Dungeons | , and it can also be purchased from the | I", "area_tags": "Chalice Dungeon; Pthumeru; Ihyll; Isz", "acquisition": "shop", "dlc": "False"}, {"item_name": "The One Reborn", "category": "Chalice Ritual Material", "sub_type": "Material", "description": "This can be an easy boss if approached correctly. The player should first take care to run past the boss and up the stairs in the corner areas and kill the Chime Maidens that are supporting the boss. This approach will be similar to fighting Tower Knight in Demon's Souls. Once this is done, head back to the boss arena and engage the boss from proximity, with a weapon that gives you either quick successive hits or a heavy knockback effect. You will want to target his mid section, making use of the specific spot between his middle legs where he has a hard time hitting you. Alternatively pick one…", "location_raw": "Drops | 10375 | 36300 | Yahar'gul Unseen Village | Yellow Backbone | x3 | Defenses | -- | 135 | 162 | 135 | -- | 135 | 290 | 70 | 40 | 999 | 999 | No | No | The One Reborn | (再誕者 const POSITIONS = {"Central Yharnam": {"x": 480, "y": 420, "region": "yharnam"}, "Cathedral Ward": {"x": 340, "y": 310, "region": "yharnam"}, "Old Yharnam": {"x": 530, "y": 510, "region": "yharnam"}, "Hemwick Charnel Lane": {"x": 220, "y": 270, "region": "yharnam"}, "Forbidden Woods": {"x": 200, "y": 370, "region": "yharnam"}, "Byrgenwerth": {"x": 130, "y": 440, "region": "yharnam"}, "Cainhurst Castle": {"x": 90, "y": 200, "region": "yharnam"}, "Forsaken Cainhurst Castle": {"x": 90, "y": 200, "region": "yharnam"}, "Upper Cathedral Ward": {"x": 300, "y": 190, "region": "upper"}, "Yahar'gul": {"x": 580, "y": 330, "region": "upper"}, "Unseen Village": {"x": 620, "y": 290, "region": "upper"}, "Lecture Building": {"x": 460, "y": 210, "region": "upper"}, "Nightmare Frontier": {"x": 380, "y": 130, "region": "nightmare"}, "Nightmare of Mensis": {"x": 560, "y": 130, "region": "nightmare"}, "Hunter's Dream": {"x": 720, "y": 440, "region": "dream"}, "Hunter's Nightmare": {"x": 750, "y": 200, "region": "dlc"}, "Research Hall": {"x": 820, "y": 130, "region": "dlc"}, "Astral Clocktower": {"x": 900, "y": 80, "region": "dlc"}, "Fishing Hamlet": {"x": 900, "y": 200, "region": "dlc"}, "Chalice Dungeon": {"x": 480, "y": 670, "region": "chalice"}, "Pthumeru": {"x": 360, "y": 720, "region": "chalice"}, "Central Pthumeru": {"x": 310, "y": 760, "region": "chalice"}, "Lower Pthumeru": {"x": 260, "y": 800, "region": "chalice"}, "Ailing Loran": {"x": 480, "y": 760, "region": "chalice"}, "Lower Loran": {"x": 480, "y": 800, "region": "chalice"}, "Ihyll": {"x": 580, "y": 730, "region": "chalice"}, "Isz": {"x": 650, "y": 700, "region": "chalice"}};
const EDGES = [["Central Yharnam", "Cathedral Ward"], ["Central Yharnam", "Old Yharnam"], ["Central Yharnam", "Hunter's Dream"], ["Cathedral Ward", "Hemwick Charnel Lane"], ["Cathedral Ward", "Forbidden Woods"], ["Cathedral Ward", "Upper Cathedral Ward"], ["Forbidden Woods", "Byrgenwerth"], ["Forbidden Woods", "Cainhurst Castle"], ["Forbidden Woods", "Yahar'gul"], ["Yahar'gul", "Unseen Village"], ["Yahar'gul", "Nightmare of Mensis"], ["Upper Cathedral Ward", "Hunter's Nightmare"], ["Lecture Building", "Nightmare Frontier"], ["Lecture Building", "Nightmare of Mensis"], ["Hunter's Nightmare", "Research Hall"], ["Research Hall", "Astral Clocktower"], ["Research Hall", "Fishing Hamlet"], ["Hunter's Dream", "Chalice Dungeon"], ["Chalice Dungeon", "Pthumeru"], ["Chalice Dungeon", "Ailing Loran"], ["Chalice Dungeon", "Ihyll"], ["Chalice Dungeon", "Isz"], ["Pthumeru", "Central Pthumeru"], ["Central Pthumeru", "Lower Pthumeru"], ["Ailing Loran", "Lower Loran"]];

// ── State ─────────────────────────────────────────────────────────────────────
let activeArea = null;
let activeFilters = {
  categories: new Set(["Key Item", "Caryll Rune", "Chalice Ritual Material"]),
  acquisitions: new Set(["found", "npc/quest", "shop", "boss drop", "enemy drop"]),
  dlc: true,
  base: true,
};

// ── Category → colour ─────────────────────────────────────────────────────────
const CAT_COLOR = {
  "Key Item":                "#8c6a30",
  "Caryll Rune":             "#7a5c8c",
  "Chalice Ritual Material": "#4a7c5c",
};

// ── Region colour ──────────────────────────────────────────────────────────────
const REGION_COLOR = {
  yharnam:   "#c8a46e",
  upper:     "#9b7fa8",
  nightmare: "#6b8fa8",
  dream:     "#8fad8c",
  dlc:       "#c87c5a",
  chalice:   "#7a8c6e",
};

// ── Filter logic ──────────────────────────────────────────────────────────────
function filteredItems() {
  return ITEMS.filter(item => {
    if (!activeFilters.categories.has(item.category)) return false;
    if (!activeFilters.acquisitions.has(item.acquisition)) return false;
    const isDLC = item.dlc === "True";
    if (isDLC && !activeFilters.dlc) return false;
    if (!isDLC && !activeFilters.base) return false;
    return true;
  });
}

function itemsForArea(areaName) {
  return filteredItems().filter(item =>
    item.area_tags.split(";").map(s => s.trim()).includes(areaName)
  );
}

// ── SVG drawing ───────────────────────────────────────────────────────────────
const svg = document.getElementById("map-svg");
const edgesLayer = document.getElementById("edges-layer");
const nodesLayer = document.getElementById("nodes-layer");

function drawEdges() {
  edgesLayer.innerHTML = "";
  EDGES.forEach(([a, b]) => {
    const pa = POSITIONS[a], pb = POSITIONS[b];
    if (!pa || !pb) return;
    const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
    line.setAttribute("x1", pa.x); line.setAttribute("y1", pa.y);
    line.setAttribute("x2", pb.x); line.setAttribute("y2", pb.y);
    line.setAttribute("class", "edge");
    edgesLayer.appendChild(line);
  });
}

function drawNodes() {
  nodesLayer.innerHTML = "";
  const fi = filteredItems();

  Object.entries(POSITIONS).forEach(([area, pos]) => {
    const areaItems = fi.filter(item =>
      item.area_tags.split(";").map(s => s.trim()).includes(area)
    );
    if (areaItems.length === 0) return;

    const total = areaItems.length;
    const radius = Math.max(14, Math.min(38, 10 + total * 1.4));
    const region = pos.region || "yharnam";
    const regionColor = REGION_COLOR[region] || "#c8a46e";

    const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
    g.setAttribute("class", "area-node");
    g.setAttribute("data-area", area);

    // glow ring for active
    const ring = document.createElementNS("http://www.w3.org/2000/svg", "circle");
    ring.setAttribute("cx", pos.x); ring.setAttribute("cy", pos.y);
    ring.setAttribute("r", radius + 4);
    ring.setAttribute("fill", "none");
    ring.setAttribute("stroke", regionColor);
    ring.setAttribute("stroke-width", "1.5");
    ring.setAttribute("opacity", area === activeArea ? "0.7" : "0");
    ring.setAttribute("class", "area-ring");
    g.appendChild(ring);

    // main circle
    const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
    circle.setAttribute("cx", pos.x); circle.setAttribute("cy", pos.y);
    circle.setAttribute("r", radius);
    circle.setAttribute("fill", regionColor);
    circle.setAttribute("fill-opacity", "0.18");
    circle.setAttribute("stroke", regionColor);
    circle.setAttribute("stroke-width", area === activeArea ? "2" : "1");
    circle.setAttribute("opacity", area === activeArea ? "1" : "0.75");
    g.appendChild(circle);

    // category pie segments as small arc indicators
    const catCounts = {};
    areaItems.forEach(item => {
      catCounts[item.category] = (catCounts[item.category] || 0) + 1;
    });
    let startAngle = -Math.PI / 2;
    const cats = Object.entries(catCounts);
    cats.forEach(([cat, count]) => {
      const slice = (count / total) * 2 * Math.PI;
      const endAngle = startAngle + slice;
      const x1 = pos.x + (radius - 3) * Math.cos(startAngle);
      const y1 = pos.y + (radius - 3) * Math.sin(startAngle);
      const x2 = pos.x + (radius - 3) * Math.cos(endAngle);
      const y2 = pos.y + (radius - 3) * Math.sin(endAngle);
      const largeArc = slice > Math.PI ? 1 : 0;
      const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      const d = `M ${pos.x} ${pos.y} L ${x1} ${y1} A ${radius - 3} ${radius - 3} 0 ${largeArc} 1 ${x2} ${y2} Z`;
      path.setAttribute("d", d);
      path.setAttribute("fill", CAT_COLOR[cat] || "#888");
      path.setAttribute("opacity", "0.6");
      g.appendChild(path);
      startAngle = endAngle;
    });

    // count label
    const countText = document.createElementNS("http://www.w3.org/2000/svg", "text");
    countText.setAttribute("x", pos.x); countText.setAttribute("y", pos.y);
    countText.setAttribute("text-anchor", "middle");
    countText.setAttribute("dominant-baseline", "middle");
    countText.setAttribute("fill", regionColor);
    countText.setAttribute("font-family", "Cinzel, serif");
    countText.setAttribute("font-size", "9");
    countText.setAttribute("font-weight", "600");
    countText.textContent = total;
    g.appendChild(countText);

    // area name label (below node)
    const labelY = pos.y + radius + 11;
    const label = document.createElementNS("http://www.w3.org/2000/svg", "text");
    label.setAttribute("x", pos.x); label.setAttribute("y", labelY);
    label.setAttribute("text-anchor", "middle");
    label.setAttribute("dominant-baseline", "middle");
    label.setAttribute("fill", area === activeArea ? regionColor : "#9a8a74");
    label.setAttribute("font-family", "Cinzel, serif");
    label.setAttribute("font-size", "7.5");
    label.setAttribute("font-weight", area === activeArea ? "600" : "400");
    label.setAttribute("letter-spacing", "0.08em");
    // wrap long names
    const words = area.split(" ");
    if (words.length > 2 && area.length > 14) {
      const mid = Math.ceil(words.length / 2);
      const line1 = document.createElementNS("http://www.w3.org/2000/svg", "tspan");
      line1.setAttribute("x", pos.x); line1.setAttribute("dy", "0");
      line1.textContent = words.slice(0, mid).join(" ");
      const line2 = document.createElementNS("http://www.w3.org/2000/svg", "tspan");
      line2.setAttribute("x", pos.x); line2.setAttribute("dy", "10");
      line2.textContent = words.slice(mid).join(" ");
      label.appendChild(line1); label.appendChild(line2);
    } else {
      label.textContent = area;
    }
    g.appendChild(label);

    g.addEventListener("click", () => selectArea(area));
    nodesLayer.appendChild(g);
  });
}

// ── Panel ─────────────────────────────────────────────────────────────────────
function selectArea(area) {
  activeArea = area;
  drawNodes();
  const panel = document.getElementById("item-panel");
  panel.classList.remove("hidden");
  document.getElementById("panel-area-name").textContent = area;

  const items = itemsForArea(area);
  document.getElementById("panel-item-count").textContent =
    `${items.length} item${items.length !== 1 ? "s" : ""}`;

  const list = document.getElementById("item-list");
  if (items.length === 0) {
    list.innerHTML = `<div class="empty-state">
      <div class="glyph">⊘</div>
      <p>No items match current filters in this area.</p>
    </div>`;
    return;
  }

  list.innerHTML = items.map((item, i) => `
    <div class="item-entry" onclick="toggleItem(this, ${i})">
      <div class="item-name">
        <span class="item-cat-dot" style="background:${CAT_COLOR[item.category]}"></span>
        ${escapeHtml(item.item_name)}
      </div>
      <div class="item-desc" id="desc-${i}">
        ${escapeHtml(item.description || "No description available.")}
      </div>
      <div class="item-meta" id="meta-${i}">
        ${item.acquisition ? `<span class="meta-tag">${escapeHtml(item.acquisition)}</span>` : ""}
        ${item.dlc === "True" ? `<span class="meta-tag" style="color:var(--dlc-accent)">DLC</span>` : ""}
        ${item.sub_type ? `<span class="meta-tag">${escapeHtml(item.sub_type)}</span>` : ""}
      </div>
    </div>
  `).join("");
}

function toggleItem(el, i) {
  const wasExpanded = el.classList.contains("expanded");
  document.querySelectorAll(".item-entry").forEach(e => {
    e.classList.remove("expanded");
    e.querySelector(".item-desc").classList.remove("show");
    e.querySelector(".item-meta").classList.remove("show");
  });
  if (!wasExpanded) {
    el.classList.add("expanded");
    document.getElementById(`desc-${i}`).classList.add("show");
    document.getElementById(`meta-${i}`).classList.add("show");
  }
}

function closePanel() {
  activeArea = null;
  document.getElementById("item-panel").classList.add("hidden");
  drawNodes();
}

// ── Filters ───────────────────────────────────────────────────────────────────
document.querySelectorAll(".cat-filter").forEach(cb => {
  cb.addEventListener("change", () => {
    if (cb.checked) activeFilters.categories.add(cb.value);
    else activeFilters.categories.delete(cb.value);
    refresh();
  });
});
document.querySelectorAll(".acq-filter").forEach(cb => {
  cb.addEventListener("change", () => {
    if (cb.checked) activeFilters.acquisitions.add(cb.value);
    else activeFilters.acquisitions.delete(cb.value);
    refresh();
  });
});
document.getElementById("dlc-filter").addEventListener("change", e => {
  activeFilters.dlc = e.target.checked; refresh();
});
document.getElementById("base-filter").addEventListener("change", e => {
  activeFilters.base = e.target.checked; refresh();
});

function refresh() {
  drawNodes();
  updateStats();
  if (activeArea) selectArea(activeArea);
}

function updateStats() {
  const fi = filteredItems();
  const catCounts = {};
  fi.forEach(item => {
    catCounts[item.category] = (catCounts[item.category] || 0) + 1;
  });
  document.getElementById("sidebar-stats").innerHTML = `
    <div>Showing <span>${fi.length}</span> of ${ITEMS.length} items</div>
    <div>Key Items: <span>${catCounts["Key Item"] || 0}</span></div>
    <div>Caryll Runes: <span>${catCounts["Caryll Rune"] || 0}</span></div>
    <div>Ritual Materials: <span>${catCounts["Chalice Ritual Material"] || 0}</span></div>
  `;
  document.getElementById("item-count-display").textContent =
    `${fi.length} items across ${Object.keys(POSITIONS).length} zones`;
}

// ── Pan/zoom ──────────────────────────────────────────────────────────────────
let viewBox = { x: 0, y: 0, w: 1000, h: 880 };
let isPanning = false, panStart = null;

svg.addEventListener("mousedown", e => {
  if (e.target.closest(".area-node")) return;
  isPanning = true;
  panStart = { x: e.clientX, y: e.clientY, vx: viewBox.x, vy: viewBox.y };
});
window.addEventListener("mousemove", e => {
  if (!isPanning) return;
  const dx = (e.clientX - panStart.x) * (viewBox.w / svg.clientWidth);
  const dy = (e.clientY - panStart.y) * (viewBox.h / svg.clientHeight);
  viewBox.x = panStart.vx - dx;
  viewBox.y = panStart.vy - dy;
  svg.setAttribute("viewBox", `${viewBox.x} ${viewBox.y} ${viewBox.w} ${viewBox.h}`);
});
window.addEventListener("mouseup", () => { isPanning = false; });

svg.addEventListener("wheel", e => {
  e.preventDefault();
  const scale = e.deltaY > 0 ? 1.1 : 0.91;
  const rect = svg.getBoundingClientRect();
  const mx = (e.clientX - rect.left) / rect.width * viewBox.w + viewBox.x;
  const my = (e.clientY - rect.top)  / rect.height * viewBox.h + viewBox.y;
  viewBox.w *= scale; viewBox.h *= scale;
  viewBox.x = mx - (e.clientX - rect.left) / rect.width * viewBox.w;
  viewBox.y = my - (e.clientY - rect.top)  / rect.height * viewBox.h;
  svg.setAttribute("viewBox", `${viewBox.x} ${viewBox.y} ${viewBox.w} ${viewBox.h}`);
}, { passive: false });

// ── Utilities ─────────────────────────────────────────────────────────────────
function escapeHtml(s) {
  if (!s) return "";
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

// ── Init ──────────────────────────────────────────────────────────────────────
drawEdges();
drawNodes();
updateStats();
</script>
</body>
